<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-label="全体アーキテクチャ。外部の memory と MCP サーバはハーネスが扱い、モデルにはコンテキストウィンドウのトークン列だけが届く。モデルの tool_use をハーネスが実行し、tool_result をコンテキストに追記して再推論するループが回る。">
        <defs>
<style>
text {font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif; fill: #151A24;}
.t-zone {font-family: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; font-size: 15px; font-weight: 700;}
.t-zsub {font-size: 11px; fill: #737D8F;}
.t-box {font-size: 12.5px; font-weight: 700;}
.t-sub {font-size: 11px; fill: #465063;}
.t-lab {font-size: 11px; fill: #465063;}
.t-lab-acc {font-size: 11px; fill: #C2410C; font-weight: 500;}
.t-mono {font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px;}
.t-num {font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; fill: #737D8F;}
.t-phase {font-family: "Zen Kaku Gothic New", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; font-size: 14px; font-weight: 700;}
.t-model {fill: #3445B8;}
.z-ext {fill: #ECEEF2;}
.z-h {fill: #E9EDF4;}
.z-ctx {fill: #FFFFFF; stroke: #D8DDE5; stroke-width: 1;}
.z-model {fill: #ECEEFA; stroke: #3445B8; stroke-width: 1.2; stroke-dasharray: 5 4;}
.bx {fill: #FFFFFF; stroke: #D8DDE5; stroke-width: 1;}
.bx-2 {fill: #F7F8FA; stroke: #D8DDE5; stroke-width: 1;}
.bx-m {fill: #F8F9FE; stroke: #3445B8; stroke-width: 1; stroke-opacity: 0.45;}
.bx-acc {fill: #FBE8DD; stroke: #C2410C; stroke-width: 1;}
.seg {fill: #F7F8FA; stroke: #D8DDE5; stroke-width: 1;}
.seg-a {fill: #F8F9FE; stroke: #D8DDE5; stroke-width: 1;}
.seg-r {fill: #FBE8DD; stroke: #D8DDE5; stroke-width: 1;}
.row-r {fill: #FFFFFF; stroke: #C2410C; stroke-width: 1; stroke-opacity: 0.6;}
.ar {stroke: #5A6477; stroke-width: 1.4; fill: none;}
.ar-acc {stroke: #C2410C; stroke-width: 1.8; fill: none;}
.ar-dash {stroke: #5A6477; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4;}
.rule-dash {stroke: #737D8F; stroke-width: 1; stroke-dasharray: 3 3; fill: none;}
.mk {fill: #5A6477;}
.mk-acc {fill: #C2410C;}
.brk {stroke: #5A6477; stroke-width: 1.2; fill: none;}
.band-x {fill: #F7F8FA; stroke: #737D8F; stroke-width: 1; stroke-dasharray: 4 3;}
text { font-family: "Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; }
.t-zone, .t-phase { font-family: "Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif; }
.t-mono, .t-num { font-family: "IBM Plex Mono",Menlo,Consolas,monospace; }
</style>
